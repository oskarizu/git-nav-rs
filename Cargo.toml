[package]
name = "git-nav"
version = "0.2.0"
edition = "2021"
authors = ["Oscar García Giménez <oscar@oskarizu.net>"]
description = "Fast interactive TUI to list local git repositories and jump into one."
license = "MIT OR Apache-2.0"
repository = "https://github.com/oskarizu/git-nav-rs"
readme = "README.md"
keywords = ["git", "cli", "tui", "navigation", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "git-nav"
path = "src/main.rs"

[lib]
name = "git_nav"
path = "src/lib.rs"

[dependencies]
crossterm = "0.28"
ratatui = "0.28"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
